<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#4a90e2"/>
  
  <!-- 上半部分图表 -->
  <g transform="translate(50, 50)">
    <!-- 标题区域 -->
    <rect x="0" y="0" width="700" height="250" fill="#5ba0f2" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 左侧标签 -->
    <rect x="10" y="20" width="80" height="30" fill="#2d5aa0" rx="5"/>
    <text x="50" y="40" text-anchor="middle" fill="white" font-family="Arial" font-size="12">统计信息</text>
    
    <!-- 主要内容区域 -->
    <text x="120" y="35" fill="white" font-family="Arial" font-size="10">FECP 2019   M_LAYER "D_LAYER_UP" TELD_LAYER_UP</text>
    
    <!-- 网络架构图 - 上半部分 -->
    <!-- 左侧网络结构 -->
    <g transform="translate(120, 60)">
      <!-- 多层矩形框架 -->
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="-10" y="-5" fill="white" font-family="Arial" font-size="8" transform="rotate(-90)">GROUP_CN_LAYER_MERG_PLAYER_TELD_LAYER_UP</text>
      
      <!-- 黄色高亮框 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 中间网络结构 -->
    <g transform="translate(280, 60)">
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="70" y="60" fill="white" font-family="Arial" font-size="8">GROUP_CN_LAYER_MERG_PLAYER_TEL_LAYER_UP</text>
      
      <!-- 绿色标签 -->
      <rect x="-20" y="40" width="40" height="20" fill="#2d8a2d" rx="3"/>
      <text x="0" y="52" text-anchor="middle" fill="white" font-family="Arial" font-size="8">大数据</text>
      <text x="0" y="62" text-anchor="middle" fill="white" font-family="Arial" font-size="8">对接新</text>
      
      <!-- 黄色高亮框 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 右侧网络结构 -->
    <g transform="translate(440, 60)">
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="70" y="60" fill="white" font-family="Arial" font-size="8">CO_3 STEPS_TELD_LAYER_UP_TEL_PACKET_TELD_LAYER_UP</text>
      
      <!-- 黄色高亮框 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 右上角标签 -->
    <rect x="580" y="20" width="100" height="60" fill="#2d5aa0" rx="5"/>
    <text x="630" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="10">CO_3 STEPS</text>
    <text x="630" y="50" text-anchor="middle" fill="white" font-family="Arial" font-size="8">TELD_LAYER_UP</text>
    <text x="630" y="65" text-anchor="middle" fill="white" font-family="Arial" font-size="8">TEL_PACKET</text>
  </g>
  
  <!-- 下半部分图表 -->
  <g transform="translate(50, 320)">
    <!-- 背景区域 -->
    <rect x="0" y="0" width="700" height="250" fill="#5ba0f2" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 左侧信息面板 -->
    <rect x="10" y="20" width="120" height="200" fill="#3d4a5c"/>
    <text x="70" y="40" text-anchor="middle" fill="white" font-family="Arial" font-size="10">FULL STACK DEV PATH</text>
    <text x="70" y="60" text-anchor="middle" fill="white" font-family="Arial" font-size="8">TELD_PACKET_5</text>
    <text x="70" y="80" text-anchor="middle" fill="white" font-family="Arial" font-size="8">BASE_65_TEL</text>
    
    <!-- 主要网络架构 - 下半部分 -->
    <g transform="translate(150, 40)">
      <!-- 左侧结构 -->
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="70" y="60" fill="white" font-family="Arial" font-size="8">CO_3_LAYERS_TELD_LAYERS_CO_3_LAYERS</text>
      
      <!-- 黄色高亮 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 中间结构 -->
    <g transform="translate(280, 40)">
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="70" y="60" fill="white" font-family="Arial" font-size="8">GET_SUBGRAPH_5_STEPS_TELD_LAYERS_5_TELD_LAYERS</text>
      
      <!-- 黄色高亮 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 右侧结构 -->
    <g transform="translate(410, 40)">
      <rect x="0" y="0" width="60" height="120" fill="none" stroke="white" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="100" fill="none" stroke="white" stroke-width="1"/>
      <rect x="20" y="20" width="20" height="80" fill="none" stroke="white" stroke-width="1"/>
      
      <!-- 白色操作语句 -->
      <text x="70" y="60" fill="white" font-family="Arial" font-size="8">FULL_STACK_DEV_PATH_TELD_PACKET_5_BASE_65_TEL</text>
      
      <!-- 黄色高亮 -->
      <rect x="5" y="130" width="50" height="40" fill="none" stroke="yellow" stroke-width="2"/>
      <rect x="15" y="140" width="30" height="20" fill="none" stroke="yellow" stroke-width="2"/>
    </g>
    
    <!-- 右侧标签 -->
    <rect x="520" y="60" width="80" height="30" fill="#2d8a2d" rx="5"/>
    <text x="560" y="80" text-anchor="middle" fill="white" font-family="Arial" font-size="10">统计信息</text>
  </g>
  
  <!-- 底部标签区域 -->
  <g transform="translate(50, 580)">
    <!-- 左侧标签 -->
    <rect x="0" y="0" width="80" height="15" fill="#2d8a2d" rx="3"/>
    <text x="40" y="10" text-anchor="middle" fill="white" font-family="Arial" font-size="8">Open order</text>
    
    <!-- 中间标签 -->
    <rect x="200" y="0" width="100" height="15" fill="#2d8a2d" rx="3"/>
    <text x="250" y="10" text-anchor="middle" fill="white" font-family="Arial" font-size="8">当前第一页</text>
    
    <!-- 右侧标签 -->
    <rect x="400" y="0" width="80" height="15" fill="#2d8a2d" rx="3"/>
    <text x="440" y="10" text-anchor="middle" fill="white" font-family="Arial" font-size="8">统计信息回收</text>
  </g>
  
  <!-- 左侧边栏 -->
  <rect x="0" y="0" width="40" height="600" fill="#6bb6ff"/>
  <text x="20" y="300" text-anchor="middle" fill="white" font-family="Arial" font-size="14" transform="rotate(-90 20 300)">JoyCode</text>
  
  <!-- 顶部标题 -->
  <rect x="0" y="0" width="800" height="40" fill="#2d5aa0"/>
  <text x="400" y="25" text-anchor="middle" fill="white" font-family="Arial" font-size="16">网络架构图</text>
</svg>